spring.application.name=fingerstock
server.port=${SERVER_PORT:8080}

# Sem perfil ativo a aplicação sobe com H2 em memória (desenvolvimento local).
# Na AWS use SPRING_PROFILES_ACTIVE=prod (ver application-prod.properties).
spring.datasource.url=jdbc:h2:mem:fingerstock;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Respeita os cabeçalhos X-Forwarded-* enviados pelo Nginx
server.forward-headers-strategy=native

management.endpoints.web.exposure.include=health
