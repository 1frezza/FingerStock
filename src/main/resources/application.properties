spring.application.name=fingerstock
server.port=${SERVER_PORT:8080}

# Sem perfil ativo a aplicação sobe com H2 em memória (desenvolvimento local).
# Na AWS use SPRING_PROFILES_ACTIVE=prod (ver application-prod.properties).
spring.datasource.url=jdbc:h2:mem:fingerstock;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Respeita os cabeçalhos X-Forwarded-* enviados pelo Nginx
server.forward-headers-strategy=native

management.endpoints.web.exposure.include=health

# Sessão apenas por cookie (sem ;jsessionid na URL)
server.servlet.session.tracking-modes=cookie

# Inclui o hash do conteúdo na URL de CSS/imagens, para o navegador não usar versão antiga em cache
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Upload de imagem dos produtos. A aplicação aceita até 2 MB; a folga é para devolver
# uma mensagem de erro amigável em vez de a conexão ser recusada.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=-1
