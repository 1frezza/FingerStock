# Perfil de produção: MySQL no AWS RDS.
# As credenciais vêm de variáveis de ambiente (/etc/fingerstock/app.env na EC2).
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:fingerstock}?createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# t3.micro: poucas conexões já bastam
spring.datasource.hikari.maximum-pool-size=5

spring.thymeleaf.cache=true
