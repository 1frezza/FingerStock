<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${produto.id == null} ? 'FingerStock · Novo produto' : 'FingerStock · Editar produto'">FingerStock</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo.png}">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<header class="topo">
    <div class="container topo-conteudo">
        <a class="marca" th:href="@{/produtos}"><img class="logo" th:src="@{/img/logo.png}" alt=""> FingerStock</a>
        <nav class="menu">
            <a th:href="@{/loja}">Loja</a>
            <a class="ativo" th:href="@{/produtos}">Estoque</a>
        </nav>
    </div>
</header>

<main class="container estreito">
    <h1 th:text="${produto.id == null} ? 'Novo produto' : 'Editar produto'">Produto</h1>

    <form class="formulario" method="post" enctype="multipart/form-data" th:object="${produto}"
          th:action="${produto.id == null} ? @{/produtos} : @{/produtos/{id}(id=${produto.id})}">

        <div class="campo">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" th:field="*{nome}" maxlength="120" required autofocus>
            <span class="erro" th:errors="*{nome}"></span>
        </div>

        <div class="linha">
            <div class="campo">
                <label for="categoria">Categoria *</label>
                <select id="categoria" th:field="*{categoria}" required>
                    <option value="">Selecione</option>
                    <option th:each="c : ${categorias}" th:value="${c}" th:text="${c.descricao}"></option>
                </select>
                <span class="erro" th:errors="*{categoria}"></span>
            </div>
            <div class="campo">
                <label for="marca">Marca</label>
                <input type="text" id="marca" th:field="*{marca}" maxlength="60">
                <span class="erro" th:errors="*{marca}"></span>
            </div>
        </div>

        <div class="linha">
            <div class="campo">
                <label for="preco">Preço (R$) *</label>
                <input type="number" id="preco" th:field="*{preco}" min="0" step="0.01" required>
                <span class="erro" th:errors="*{preco}"></span>
            </div>
            <div class="campo">
                <label for="quantidade">Quantidade em estoque *</label>
                <input type="number" id="quantidade" th:field="*{quantidade}" min="0" step="1" required>
                <span class="erro" th:errors="*{quantidade}"></span>
            </div>
        </div>

        <div class="campo">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" th:field="*{descricao}" rows="3" maxlength="500"></textarea>
            <span class="erro" th:errors="*{descricao}"></span>
        </div>

        <div class="campo">
            <label for="arquivo">Imagem do produto</label>
            <div class="upload">
                <img class="previa" id="previa" alt="" th:if="${produto.imagemSrc != null}" th:src="@{${produto.imagemSrc}}">
                <div>
                    <input type="file" id="arquivo" name="arquivo" accept="image/png,image/jpeg,image/webp,image/gif">
                    <span class="dica">Opcional. PNG, JPG, WEBP ou GIF de até 2 MB. Sem imagem, é usada a ilustração da categoria.</span>
                    <label class="opcao" th:if="${produto.imagemVersao != null}">
                        <input type="checkbox" name="removerImagem" value="true"> Remover a imagem atual
                    </label>
                </div>
            </div>
            <span class="erro" th:if="${erroImagem}" th:text="${erroImagem}"></span>
        </div>

        <div class="botoes">
            <a class="botao secundario" th:href="@{/produtos}">Cancelar</a>
            <button type="submit" class="botao">Salvar</button>
        </div>
    </form>
</main>

<script>
    // Mostra a imagem escolhida antes de salvar
    document.getElementById('arquivo').addEventListener('change', function () {
        var previa = document.getElementById('previa');
        if (previa && this.files[0]) {
            previa.src = URL.createObjectURL(this.files[0]);
        }
    });
</script>
</body>
</html>
