<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${produto.id == null} ? 'FingerStock · Novo produto' : 'FingerStock · Editar produto'">FingerStock</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo.png}">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<header class="topo">
    <div class="container topo-conteudo">
        <a class="marca" th:href="@{/produtos}"><img class="logo" th:src="@{/img/logo.png}" alt=""> FingerStock</a>
        <span class="subtitulo">Estoque da loja de skates de dedo</span>
    </div>
</header>

<main class="container estreito">
    <h1 th:text="${produto.id == null} ? 'Novo produto' : 'Editar produto'">Produto</h1>

    <form class="formulario" method="post" th:object="${produto}"
          th:action="${produto.id == null} ? @{/produtos} : @{/produtos/{id}(id=${produto.id})}">

        <div class="campo">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" th:field="*{nome}" maxlength="120" required autofocus>
            <span class="erro" th:errors="*{nome}"></span>
        </div>

        <div class="linha">
            <div class="campo">
                <label for="categoria">Categoria *</label>
                <select id="categoria" th:field="*{categoria}" required>
                    <option value="">Selecione</option>
                    <option th:each="c : ${categorias}" th:value="${c}" th:text="${c.descricao}"></option>
                </select>
                <span class="erro" th:errors="*{categoria}"></span>
            </div>
            <div class="campo">
                <label for="marca">Marca</label>
                <input type="text" id="marca" th:field="*{marca}" maxlength="60">
                <span class="erro" th:errors="*{marca}"></span>
            </div>
        </div>

        <div class="linha">
            <div class="campo">
                <label for="preco">Preço (R$) *</label>
                <input type="number" id="preco" th:field="*{preco}" min="0" step="0.01" required>
                <span class="erro" th:errors="*{preco}"></span>
            </div>
            <div class="campo">
                <label for="quantidade">Quantidade em estoque *</label>
                <input type="number" id="quantidade" th:field="*{quantidade}" min="0" step="1" required>
                <span class="erro" th:errors="*{quantidade}"></span>
            </div>
        </div>

        <div class="campo">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" th:field="*{descricao}" rows="3" maxlength="500"></textarea>
            <span class="erro" th:errors="*{descricao}"></span>
        </div>

        <div class="campo">
            <label for="imagemUrl">URL da imagem</label>
            <input type="url" id="imagemUrl" th:field="*{imagemUrl}" maxlength="300" placeholder="https://...">
            <span class="dica">Opcional. Em branco, é usada a ilustração da categoria.</span>
            <span class="erro" th:errors="*{imagemUrl}"></span>
        </div>

        <div class="botoes">
            <a class="botao secundario" th:href="@{/produtos}">Cancelar</a>
            <button type="submit" class="botao">Salvar</button>
        </div>
    </form>
</main>
</body>
</html>
